<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Premium</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Bouton Mode Sombre / Clair -->
    <button class="theme-toggle" id="themeToggle">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Formes décoratives -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <!-- La Carte Centrale -->
    <div class="login-card">
        
        <!-- Logo -->
        <div class="logo-container">
            <img src="logo.jpeg" alt="Logo" style="width: 70px; height: 70px; object-fit: contain">
        </div>

        <h1>Welcome To Vintly</h1>
        <p class="subtitle">Sign in to continue</p>

        <form>
            <!-- Champ Username -->
            <div class="input-group">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="Username or Email" required>
            </div>

            <!-- Champ Password -->
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" id="passwordInput" required>
                <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
            </div>

            <!-- Options -->
            <div class="options">
                <label class="remember">
                    <input type="checkbox" checked>
                    <span>Remember Me</span>
                </label>
                <a href="#" class="forgot">Forgot Password?</a>
            </div>

            <!-- Bouton Login -->
            <button type="submit" class="login-btn">
                Login <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- Séparateur -->
        <div class="divider">
            <span>OR CONTINUE WITH</span>
        </div>

        <!-- Boutons Sociaux : Google et Apple -->
        <div class="social-login">
            <button class="social-btn google" title="Google">
                <!-- Logo Google Multicolore en SVG -->
                <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </button>
            <button class="social-btn apple" title="Apple">
                <i class="fa-brands fa-apple"></i>
            </button>
        </div>

        <div class="footer-text">
            <p>PLAY • COMPETE • GROW TOGETHER</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
